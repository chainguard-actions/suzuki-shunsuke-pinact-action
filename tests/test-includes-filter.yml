name: Test pinact with includes filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a pinned workflow file and commit it
      - name: Create a pinned workflow file and commit it
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/included-pinned.yml << 'EOF'
          name: Included Pinned
          on: [push]
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
          EOF
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add .github/workflows/included-pinned.yml
          git commit -m "add pinned workflow for includes test"

      # Run with includes to only check the specific pinned workflow
      - id: action
        uses: .
        with:
          skip_push: "true"
          includes: |
            .github/workflows/included-pinned.yml
        continue-on-error: true

      - name: Assert action ran with includes filtering
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with includes filtering"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or pinact issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
