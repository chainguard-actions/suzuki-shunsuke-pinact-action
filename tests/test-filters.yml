name: Test filter and path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          includes: |
            .github/workflows/*.yml
          excludes: |
            .github/workflows/skip.yml
          separator: ","
          branch_to_tags: |
            actions/checkout:main=v4
          min_age: "7d"
          config: ".pinact.yml"
          diff_file: "/tmp/pinact.diff"
          fix: "false"
          no_api: "true"
          skip_push: "true"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with filter inputs (errors expected without real token)"
          echo "PASS"
