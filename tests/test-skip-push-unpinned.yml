name: Test pinact skip_push with unpinned actions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a workflow file with unpinned actions (using tag only, no SHA)
      # and commit it so that git ls-files picks it up
      - name: Create an unpinned workflow file and commit it
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/unpinned-test.yml << 'EOF'
          name: Unpinned Actions
          on: [push]
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
          EOF
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add .github/workflows/unpinned-test.yml
          git commit -m "add unpinned workflow for test"

      # With skip_push=true and unpinned actions, pinact should detect the issue
      # and fail (exit non-zero with "GitHub Actions aren't pinned.")
      - id: action
        uses: .
        with:
          skip_push: "true"
        continue-on-error: true

      - name: Assert action detected unpinned actions
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the workflow file has unpinned actions
          # (pinact detects actions/checkout@v4 as unpinned)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed detecting unpinned actions"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for unpinned actions"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
