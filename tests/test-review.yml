name: Test review and reviewdog inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token_for_review: ${{ github.token }}
          review: "false"
          reviewdog_filter_mode: "added"
          reviewdog_fail_level: "error"
          reviewdog_level: "warning"
          fix: "false"
          no_api: "true"
          skip_push: "true"
      - name: Assert action completed
        run: |
          echo "Action completed successfully with reviewdog inputs"
          echo "PASS"
