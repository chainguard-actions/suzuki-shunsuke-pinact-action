name: Test filtering and config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          fix: "false"
          no_api: "true"
          skip_push: "true"
          includes: |
            .github/workflows/*.yml
          excludes: |
            .github/workflows/skip.yml
          separator: ","
          branch_to_tags: |
            v3:v3.0.0
          config: ""
          diff_file: ""
          min_age: "7d"
          verify_min_age: "false"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with filtering and config inputs"
          echo "PASS"
