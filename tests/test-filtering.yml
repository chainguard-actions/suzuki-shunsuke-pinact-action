name: Test filtering and config inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create diff file path
        run: |
          echo "/tmp/pinact.diff" > /tmp/diff_file_path.txt
      - id: action
        uses: .
        with:
          includes: |
            .github/workflows/*.yml
          excludes: |
            .github/workflows/skip.yml
          separator: ","
          branch_to_tags: |
            actions/checkout:main=v4
          min_age: "7d"
          verify_min_age: "false"
          config: ""
          diff_file: "/tmp/pinact.diff"
          fix: "false"
          no_api: "true"
          skip_push: "true"
      - name: Assert action completed
        run: |
          echo "Action completed successfully with filtering inputs"
          echo "PASS"
