name: Test securefix inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          securefix_app_id: "99999"
          securefix_app_private_key: "dummy-securefix-private-key"
          securefix_server_repository: "example-org/securefix-server"
          fix: "false"
          skip_push: "true"
          no_api: "true"
        continue-on-error: true
      - name: Assert action ran with securefix inputs
        run: |
          echo "PASS: action accepted securefix_app_id, securefix_app_private_key, and securefix_server_repository inputs"
