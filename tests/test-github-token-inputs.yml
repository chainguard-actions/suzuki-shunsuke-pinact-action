name: Test github_token and github_token_for_push inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          github_token_for_push: ${{ github.token }}
          fix: "false"
          skip_push: "true"
          no_api: "true"
      - name: Assert action completed
        run: |
          echo "PASS: action completed with github_token and github_token_for_push inputs"
