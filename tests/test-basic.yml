name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          fix: "false"
          no_api: "true"
          skip_push: "true"
          update: "false"
          verify: "false"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (exit may be non-zero without real token, that is expected)"
          echo "PASS"
