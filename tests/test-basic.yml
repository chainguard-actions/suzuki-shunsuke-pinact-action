name: Test basic usage with skip_push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          skip_push: "true"
          update: "false"
          verify: "false"
      - name: Assert action completed
        run: |
          echo "PASS: action completed without error"
