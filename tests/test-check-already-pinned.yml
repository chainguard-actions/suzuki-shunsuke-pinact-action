name: Test pinact check mode - already pinned actions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake pinact binary
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-pinact.sh" "$HOME/.local/bin/pinact"
          chmod +x "$HOME/.local/bin/pinact"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run pinact in check mode (fix=false, no_api=true, skip_push=true)
        id: pinact
        uses: .
        with:
          fix: "false"
          no_api: "true"
          skip_push: "true"
          includes: |
            tests/fixtures/workflows/pinned-workflow.yml

      - name: Assert action completed successfully
        run: |
          echo "PASS: pinact completed in check mode without errors"
