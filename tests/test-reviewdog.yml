name: Test reviewdog inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          review: "true"
          reviewdog_filter_mode: "diff_context"
          reviewdog_fail_level: "error"
          reviewdog_level: "warning"
          github_token_for_review: "dummy-review-token"
          fix: "false"
          no_api: "true"
          skip_push: "true"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with reviewdog inputs (errors expected without real token)"
          echo "PASS"
