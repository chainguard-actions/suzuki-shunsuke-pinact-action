name: Test reviewdog-related inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token_for_review: ${{ github.token }}
          reviewdog_filter_mode: "nofilter"
          reviewdog_level: "warning"
          review: "false"
          fix: "false"
          skip_push: "true"
          no_api: "true"
      - name: Assert action ran with reviewdog inputs
        run: |
          echo "PASS: action accepted github_token_for_review, reviewdog_filter_mode, and reviewdog_level inputs"
