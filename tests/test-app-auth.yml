name: Test GitHub App auth inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          app_id: "12345"
          app_private_key: "dummy-private-key"
          fix: "false"
          no_api: "true"
          skip_push: "true"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with GitHub App auth inputs"
          echo "PASS"
