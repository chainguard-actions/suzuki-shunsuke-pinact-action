name: Test pinact with default options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake pinact binary
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-pinact.sh" "$HOME/.local/bin/pinact"
          chmod +x "$HOME/.local/bin/pinact"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run pinact with default options (fix=true, skip_push=true, no_api=true)
        id: pinact
        uses: .
        with:
          # fix defaults to true, but we skip push to avoid git operations
          skip_push: "true"
          # Use no_api to avoid GitHub API calls for SHA resolution
          no_api: "true"
          # Limit to only our committed fixture file to avoid scanning other workflow files
          includes: |
            tests/fixtures/workflows/pinned-workflow.yml

      - name: Assert action completed successfully
        run: |
          echo "PASS: pinact completed with default options"
