name: Test securefix inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          securefix_app_id: "12345"
          securefix_app_private_key: "dummy-private-key"
          securefix_server_repository: "owner/repo"
          fix: "false"
          no_api: "true"
          skip_push: "true"
      - name: Assert action completed
        run: |
          echo "Action completed successfully with securefix inputs"
          echo "PASS"
