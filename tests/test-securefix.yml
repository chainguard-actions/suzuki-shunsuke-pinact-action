name: Test Securefix inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          securefix_app_id: "789012"
          securefix_app_private_key: "dummy-securefix-private-key"
          securefix_server_repository: "my-org/securefix-server"
          fix: "false"
          no_api: "true"
          skip_push: "true"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed with securefix inputs (errors expected without real credentials)"
          echo "PASS"
