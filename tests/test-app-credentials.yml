name: Test app_id and app_private_key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          app_id: "12345"
          app_private_key: "dummy-private-key-for-coverage"
          fix: "false"
          skip_push: "true"
          no_api: "true"
        continue-on-error: true
      - name: Assert action ran with app credentials inputs
        run: |
          echo "PASS: action accepted app_id and app_private_key inputs"
